spring:
  application:
    name: gerenciador-de-salas
  jackson:
    default-property-inclusion: non_null
  jackson2:
    default-property-inclusion: non_null
  http:
    converters:
      preferred-json-mapper: jackson2
  web:
    resources:
      add-mappings: false

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax