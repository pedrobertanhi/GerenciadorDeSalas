    url: jdbc:postgresql://localhost:5432/gerenciador_salas_dev
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true

logging:
  level:
    br.com.senac.gerenciadordesalas: DEBUG