<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inativar sala | Gerenciador de Salas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 720px">
  <h1 class="mb-4">Inativar sala</h1>
  <div class="card card-body shadow-sm">
    <p>Você vai inativar a sala <strong th:text="${sala.nome}">Sala</strong>
       (<span th:text="${sala.capacidade}">0</span> pessoas, <span th:text="${sala.localizacao}">local</span>).</p>
    <p class="text-muted">A sala deixa de aparecer nas pesquisas e não recebe novas reservas.
       As reservas já registradas permanecem no histórico.</p>
    <form method="post" th:action="@{/salas/{id}/inativar(id=${sala.id})}" class="d-flex flex-wrap gap-2">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="btn btn-danger" type="submit">Confirmar inativação</button>
      <a class="btn btn-outline-secondary" th:href="@{/salas}">Cancelar</a>
    </form>
  </div>
</main>
</body>
</html>
