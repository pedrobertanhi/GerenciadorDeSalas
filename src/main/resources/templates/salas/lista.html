<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salas | Gerenciador de Salas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<header th:replace="~{fragmentos/layout :: cabecalho}"></header>
<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <h1>Salas</h1>
    <a class="btn btn-primary" th:if="${administrador}" th:href="@{/salas/novo}">Cadastrar sala</a>
    <a class="btn btn-outline-primary" th:if="${administrador}" th:href="@{/usuarios}">Gerenciar usuários</a>
  </div>
  <div th:if="${sucesso}" class="alert alert-success" role="status" th:text="${sucesso}"></div>
  <div th:if="${aviso}" class="alert alert-warning" role="alert" th:text="${aviso}"></div>
  <div th:if="${erroFiltro}" class="alert alert-danger" role="alert" th:text="${erroFiltro}"></div>
  <form method="get" th:action="@{/salas}" class="row g-2 mb-4">
    <div class="col-sm-4">
      <label for="capacidadeMinima" class="form-label">Capacidade mínima</label>
      <input id="capacidadeMinima" name="capacidadeMinima" type="number" min="1" step="1" inputmode="numeric"
             class="form-control" th:value="${capacidadeMinima}" placeholder="Ex.: 30">
    </div>
    <div class="col-sm-5">
      <label for="localizacao" class="form-label">Localização</label>
      <input id="localizacao" name="localizacao" class="form-control" th:value="${localizacao}"
             maxlength="255" placeholder="Ex.: Bloco A">
    </div>
    <div class="col-sm-3 d-flex align-items-end gap-2">
      <button class="btn btn-outline-primary" type="submit">Pesquisar</button>
      <a class="btn btn-outline-secondary" th:href="@{/salas}">Limpar</a>
    </div>
  </form>
  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <caption>Salas ativas cadastradas</caption>
      <thead>
        <tr>
          <th scope="col">Nome</th>
          <th scope="col">Capacidade</th>
          <th scope="col">Localização</th>
          <th scope="col">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="sala : ${resultado.content}">
          <td th:text="${sala.nome}"></td>
          <td th:text="${sala.capacidade}"></td>
          <td th:text="${sala.localizacao}"></td>
          <td>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/salas/{id}(id=${sala.id})}">Detalhes</a>
            <a th:if="${administrador}" class="btn btn-sm btn-outline-primary"
               th:href="@{/salas/{id}/editar(id=${sala.id})}">Editar</a>
            <a th:if="${administrador}" class="btn btn-sm btn-outline-danger"
               th:href="@{/salas/{id}/inativar(id=${sala.id})}">Inativar</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(resultado.content)}">
          <td colspan="4" class="text-center">Nenhuma sala encontrada.</td>
        </tr>
      </tbody>
    </table>
  </div>
  <nav th:if="${resultado.totalPages > 1}" aria-label="Paginação das salas">
    <ul class="pagination">
      <li class="page-item" th:classappend="${resultado.first} ? 'disabled'">
        <a class="page-link"
           th:href="@{/salas(page=${resultado.number - 1},capacidadeMinima=${capacidadeMinima},localizacao=${localizacao})}">Anterior</a>
      </li>
      <li class="page-item disabled">
        <span class="page-link" th:text="'Página ' + ${resultado.number + 1} + ' de ' + ${resultado.totalPages}"></span>
      </li>
      <li class="page-item" th:classappend="${resultado.last} ? 'disabled'">
        <a class="page-link"
           th:href="@{/salas(page=${resultado.number + 1},capacidadeMinima=${capacidadeMinima},localizacao=${localizacao})}">Próxima</a>
      </li>
    </ul>
  </nav>
</main>
</body>
</html>
