<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' | Gerenciador de Salas'">Sala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<header th:replace="~{fragmentos/layout :: cabecalho}"></header>
<main class="container py-5" style="max-width: 720px">
  <h1 class="mb-4" th:text="${titulo}">Cadastrar sala</h1>
  <form method="post" th:action="${acao}" th:object="${form}" class="card card-body shadow-sm">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="mb-3">
      <label class="form-label" for="nome">Nome</label>
      <input id="nome" type="text" class="form-control" th:field="*{nome}" maxlength="100" required>
      <div class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="capacidade">Capacidade (pessoas)</label>
      <input id="capacidade" type="number" min="1" step="1" inputmode="numeric" class="form-control"
             th:field="*{capacidade}" required>
      <div class="text-danger" th:if="${#fields.hasErrors('capacidade')}" th:errors="*{capacidade}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="localizacao">Localização</label>
      <input id="localizacao" type="text" class="form-control" th:field="*{localizacao}" maxlength="255" required>
      <div class="text-danger" th:if="${#fields.hasErrors('localizacao')}" th:errors="*{localizacao}"></div>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-primary" type="submit">Salvar</button>
      <a class="btn btn-outline-secondary" th:href="@{/salas}">Cancelar</a>
    </div>
  </form>
</main>
</body>
</html>
