<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${sala.nome} + ' | Gerenciador de Salas'">Sala</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<header th:replace="~{fragmentos/layout :: cabecalho}"></header>
<main class="container py-5" style="max-width: 720px">
  <h1 class="mb-4" th:text="${sala.nome}">Sala</h1>
  <div class="card card-body shadow-sm mb-4">
    <dl class="row mb-0">
      <dt class="col-sm-4">Capacidade</dt>
      <dd class="col-sm-8" th:text="${sala.capacidade} + ' pessoas'"></dd>
      <dt class="col-sm-4">Localização</dt>
      <dd class="col-sm-8" th:text="${sala.localizacao}"></dd>
    </dl>
  </div>
  <div class="d-flex flex-wrap gap-2">
    <a class="btn btn-outline-secondary" th:href="@{/salas}">Voltar para a lista</a>
    <a th:if="${administrador}" class="btn btn-outline-primary" th:href="@{/salas/{id}/editar(id=${sala.id})}">Editar</a>
    <a th:if="${administrador}" class="btn btn-outline-danger" th:href="@{/salas/{id}/inativar(id=${sala.id})}">Inativar</a>
  </div>
</main>
</body>
</html>
