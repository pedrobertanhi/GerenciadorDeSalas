<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Gerenciador de Salas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 480px">
  <h1 class="mb-4">Entrar no sistema</h1>
  <div th:if="${param.erro}" class="alert alert-danger" role="alert">E-mail ou senha inválidos.</div>
  <form method="post" th:action="@{/login}" class="card card-body shadow-sm">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="mb-3">
      <label for="email" class="form-label">E-mail</label>
      <input type="email" name="email" id="email" class="form-control" autocomplete="username" required>
    </div>
    <div class="mb-3">
      <label for="senha" class="form-label">Senha</label>
      <input type="password" name="senha" id="senha" class="form-control" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary">Entrar</button>
  </form>
</main>
</body>
</html>
