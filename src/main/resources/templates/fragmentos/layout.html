<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Cabecalho comum (ENT-03, #185): navegacao principal por perfil, usuario conectado e Sair.
  As telas incluem com: <header th:replace="~{fragmentos/layout :: cabecalho}"></header>
  Os dados vem do MenuDoUsuarioAdvice. Os itens administrativos so aparecem para o perfil
  autorizado; a autorizacao real continua no SecurityConfig e nos controllers.
-->
<header th:fragment="cabecalho" th:if="${menu != null and menu.autenticado}">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary" aria-label="Navegação principal">
    <div class="container">
      <a class="navbar-brand" th:href="@{/reservas}">Gerenciador de Salas</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
              aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu de navegação">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" th:href="@{/reservas}">Reservas</a></li>
          <li class="nav-item" th:if="${menu.administrador}"><a class="nav-link" th:href="@{/salas}">Salas</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/recursos/pesquisa}">Pesquisar recursos</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/manutencoes}">Manutenções</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/professores}">Professores</a></li>
          <li class="nav-item" th:if="${menu.responsavel}">
            <a class="nav-link" th:href="@{/aprovacoes}">Aprovações</a>
          </li>
          <li class="nav-item" th:if="${menu.administrador}">
            <a class="nav-link" th:href="@{/usuarios}">Usuários</a>
          </li>
        </ul>
        <div class="d-flex flex-wrap align-items-center gap-2">
          <span class="navbar-text small text-break">
            Conectado como <strong th:text="${menu.usuario}"></strong>
          </span>
          <form method="post" th:action="@{/logout}" class="m-0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-sm btn-outline-light" type="submit">Sair</button>
          </form>
        </div>
      </div>
    </div>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Estado de carregamento: ao enviar um formulario, os botoes mostram "Processando..." e ficam
    // desabilitados, evitando envio duplicado. O setTimeout deixa o navegador montar o envio antes.
    document.addEventListener('submit', function (evento) {
      if (evento.defaultPrevented) {
        return;
      }
      var formulario = evento.target;
      formulario.setAttribute('aria-busy', 'true');
      setTimeout(function () {
        formulario.querySelectorAll('button[type="submit"]').forEach(function (botao) {
          botao.dataset.textoOriginal = botao.textContent;
          botao.textContent = 'Processando...';
          botao.disabled = true;
        });
      }, 0);
    });
    // Ao voltar pelo historico do navegador, os botoes voltam ao normal.
    window.addEventListener('pageshow', function () {
      document.querySelectorAll('button[data-texto-original]').forEach(function (botao) {
        botao.textContent = botao.dataset.textoOriginal;
        botao.disabled = false;
        botao.removeAttribute('data-texto-original');
      });
      document.querySelectorAll('form[aria-busy]').forEach(function (formulario) {
        formulario.removeAttribute('aria-busy');
      });
    });
  </script>
</header>
</body>
</html>
