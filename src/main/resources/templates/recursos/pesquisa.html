<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesquisar recursos | Gerenciador de Salas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
  <h1 class="mb-4">Pesquisar recursos</h1>
  <div th:if="${not #lists.isEmpty(erros)}" class="alert alert-danger" role="alert">
    <ul class="mb-0">
      <li th:each="erro : ${erros}" th:text="${erro}"></li>
    </ul>
  </div>
  <form method="get" th:action="@{/recursos/pesquisa}" class="card card-body shadow-sm mb-4">
    <div class="row g-3">
      <div class="col-md-4">
        <label for="recurso" class="form-label">Recurso</label>
        <select id="recurso" name="recurso" class="form-select">
          <option value="SALA" th:selected="${recurso == 'SALA'}">Salas</option>
          <option value="MATERIAL" th:selected="${recurso == 'MATERIAL'}">Materiais e equipamentos</option>
          <option value="PROFESSOR" th:selected="${recurso == 'PROFESSOR'}">Professores</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="capacidadeMinima" class="form-label">Capacidade mínima (salas)</label>
        <input id="capacidadeMinima" name="capacidadeMinima" type="number" min="1" class="form-control"
               th:value="${capacidadeMinima}" placeholder="Ex.: 30">
      </div>
      <div class="col-md-4">
        <label for="localizacao" class="form-label">Localização (salas e materiais)</label>
        <input id="localizacao" name="localizacao" class="form-control" maxlength="150"
               th:value="${localizacao}" placeholder="Ex.: Bloco A">
      </div>
      <div class="col-md-4">
        <label for="tipo" class="form-label">Tipo (materiais)</label>
        <select id="tipo" name="tipo" class="form-select">
          <option value="">Todos</option>
          <option value="MATERIAL" th:selected="${tipo == 'MATERIAL'}">Material</option>
          <option value="EQUIPAMENTO" th:selected="${tipo == 'EQUIPAMENTO'}">Equipamento</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="competencia" class="form-label">Competência (professores)</label>
        <input id="competencia" name="competencia" class="form-control" maxlength="100"
               th:value="${competencia}" placeholder="Ex.: java">
      </div>
      <div class="col-md-4 d-flex align-items-end gap-2">
        <button class="btn btn-primary" type="submit">Pesquisar</button>
        <a class="btn btn-outline-secondary" th:href="@{/recursos/pesquisa}">Limpar</a>
      </div>
    </div>
    <div class="form-text mt-2">Cada filtro vale para o recurso indicado entre parênteses e pode ser combinado com os demais filtros desse recurso.</div>
  </form>
  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <caption th:text="${resultado.totalElements} + ' recurso(s) ativo(s) encontrado(s)'">Recursos encontrados</caption>
      <thead><tr><th scope="col">Nome</th><th scope="col">Detalhes</th><th scope="col">Localização</th></tr></thead>
      <tbody>
        <tr th:each="linha : ${resultado.content}">
          <td th:text="${linha.nome}"></td>
          <td th:text="${linha.detalhes}"></td>
          <td th:text="${linha.localizacao}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(resultado.content)}"><td colspan="3" class="text-center">Nenhum recurso encontrado.</td></tr>
      </tbody>
    </table>
  </div>
  <nav th:if="${resultado.totalPages > 1}" aria-label="Paginação dos resultados">
    <ul class="pagination">
      <li class="page-item" th:classappend="${resultado.first} ? 'disabled'">
        <a class="page-link" th:href="@{/recursos/pesquisa(recurso=${recurso},capacidadeMinima=${capacidadeMinima},localizacao=${localizacao},tipo=${tipo},competencia=${competencia},pagina=${resultado.number - 1})}">Anterior</a>
      </li>
      <li class="page-item disabled">
        <span class="page-link" th:text="'Página ' + ${resultado.number + 1} + ' de ' + ${resultado.totalPages}"></span>
      </li>
      <li class="page-item" th:classappend="${resultado.last} ? 'disabled'">
        <a class="page-link" th:href="@{/recursos/pesquisa(recurso=${recurso},capacidadeMinima=${capacidadeMinima},localizacao=${localizacao},tipo=${tipo},competencia=${competencia},pagina=${resultado.number + 1})}">Próxima</a>
      </li>
    </ul>
  </nav>
</main>
</body>
</html>
