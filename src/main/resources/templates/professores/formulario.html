<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' | Gerenciador de Salas'">Professor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 720px">
  <h1 class="mb-4" th:text="${titulo}">Cadastrar professor</h1>
  <form method="post" th:action="${acao}" th:object="${form}" class="card card-body shadow-sm">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="mb-3">
      <label class="form-label" for="nome">Nome</label>
      <input id="nome" type="text" class="form-control" th:field="*{nome}" maxlength="150" required>
      <div class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="email">E-mail</label>
      <input id="email" type="email" class="form-control" th:field="*{email}" maxlength="254" required>
      <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="competencias">Competências</label>
      <input id="competencias" class="form-control" th:field="*{competencias}" placeholder="Matemática, Física">
      <div class="form-text">Separe as competências por vírgula.</div>
      <div class="text-danger" th:if="${#fields.hasErrors('competencias')}" th:errors="*{competencias}"></div>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Salvar</button>
      <a class="btn btn-outline-secondary" th:href="@{/professores}">Cancelar</a>
    </div>
  </form>
</main>
</body>
</html>
