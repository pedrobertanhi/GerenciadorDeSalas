<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Professores | Gerenciador de Salas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <h1>Professores</h1>
    <a class="btn btn-primary" th:href="@{/professores/novo}">Cadastrar professor</a>
  </div>
  <div th:if="${sucesso}" class="alert alert-success" role="status" th:text="${sucesso}"></div>
  <form method="get" th:action="@{/professores}" class="row g-2 mb-4">
    <div class="col-sm-8">
      <label for="competencia" class="form-label">Filtrar por competência</label>
      <input id="competencia" name="competencia" class="form-control" th:value="${competencia}" maxlength="100" placeholder="Ex.: matemática">
    </div>
    <div class="col-sm-4 d-flex align-items-end gap-2">
      <button class="btn btn-outline-primary" type="submit">Pesquisar</button>
      <a class="btn btn-outline-secondary" th:href="@{/professores}">Limpar</a>
    </div>
  </form>
  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <caption>Professores ativos cadastrados</caption>
      <thead><tr><th scope="col">Nome</th><th scope="col">E-mail</th><th scope="col">Competências</th><th scope="col">Ações</th></tr></thead>
      <tbody>
        <tr th:each="professor : ${professores}">
          <td th:text="${professor.nome}"></td>
          <td th:text="${professor.email}"></td>
          <td th:text="${#strings.listJoin(professor.competencias, ', ')}"></td>
          <td>
            <a class="btn btn-sm btn-outline-primary" th:href="@{/professores/{id}/editar(id=${professor.id})}">Editar</a>
            <form class="d-inline" method="post" th:action="@{/professores/{id}/desativar(id=${professor.id})}">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn btn-sm btn-outline-danger" type="submit">Desativar</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(professores)}"><td colspan="4" class="text-center">Nenhum professor encontrado.</td></tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
