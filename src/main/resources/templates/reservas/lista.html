<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas reservas | Gerenciador de Salas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light"><main class="container py-5">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4"><h1>Reservas</h1><a class="btn btn-primary" th:href="@{/reservas/nova}">Nova reserva</a></div>
  <div class="table-responsive"><table class="table table-striped align-middle"><caption>Histórico de reservas visíveis ao seu perfil</caption>
    <thead><tr><th>Sala</th><th>Período</th><th>Finalidade</th><th>Status</th><th>Ações</th></tr></thead><tbody>
      <tr th:each="reserva : ${reservas}"><td th:text="${reserva.sala}"></td><td th:text="${reserva.periodo}"></td><td th:text="${reserva.finalidade}"></td><td><span class="badge text-bg-secondary" th:text="${reserva.status}"></span></td>
        <td class="d-flex flex-wrap gap-1"><a class="btn btn-sm btn-outline-secondary" th:href="@{/reservas/{id}(id=${reserva.id})}">Detalhes</a><a th:if="${reserva.permiteAlteracao}" class="btn btn-sm btn-outline-primary" th:href="@{/reservas/{id}/editar(id=${reserva.id})}">Alterar</a><a th:if="${reserva.permiteCancelamento}" class="btn btn-sm btn-outline-danger" th:href="@{/reservas/{id}/cancelar(id=${reserva.id})}">Cancelar</a></td>
      </tr><tr th:if="${#lists.isEmpty(reservas)}"><td colspan="5" class="text-center">Nenhuma reserva encontrada.</td></tr>
    </tbody></table></div>
</main></body></html>
