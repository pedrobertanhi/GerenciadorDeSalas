<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reserva | Gerenciador de Salas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light">
<header th:replace="~{fragmentos/layout :: cabecalho}"></header><main class="container py-5" style="max-width:850px"><h1>Detalhes da reserva</h1><div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div><div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div><div class="card card-body shadow-sm"><dl class="row mb-0"><dt class="col-sm-4">Sala</dt><dd class="col-sm-8" th:text="${reserva.sala}"></dd><dt class="col-sm-4">Professor</dt><dd class="col-sm-8" th:text="${reserva.professor}"></dd><dt class="col-sm-4">Período</dt><dd class="col-sm-8" th:text="${reserva.periodo}"></dd><dt class="col-sm-4">Finalidade</dt><dd class="col-sm-8" th:text="${reserva.finalidade}"></dd><dt class="col-sm-4">Status</dt><dd class="col-sm-8"><span class="badge text-bg-secondary" th:text="${reserva.status}"></span></dd><dt class="col-sm-4">Materiais</dt><dd class="col-sm-8"><span th:if="${#lists.isEmpty(reserva.materiais)}">Nenhum</span><ul th:unless="${#lists.isEmpty(reserva.materiais)}"><li th:each="m:${reserva.materiais}" th:text="${m}"></li></ul></dd></dl></div><div class="d-flex flex-wrap gap-2 mt-4"><a class="btn btn-outline-secondary" th:href="@{/reservas}">Voltar</a><a th:if="${reserva.permiteAlteracao}" class="btn btn-primary" th:href="@{/reservas/{id}/editar(id=${reserva.id})}">Alterar reserva</a><a th:if="${reserva.permiteCancelamento}" class="btn btn-outline-danger" th:href="@{/reservas/{id}/cancelar(id=${reserva.id})}">Cancelar reserva</a></div></main></body></html>
