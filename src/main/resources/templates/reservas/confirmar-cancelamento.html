<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cancelar reserva | Gerenciador de Salas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:700px"><h1>Confirmar cancelamento</h1><div class="alert alert-warning">A reserva não será apagada: ela continuará disponível no histórico como cancelada.</div><div class="card card-body"><p><strong>Sala:</strong> <span th:text="${reserva.sala}"></span></p><p><strong>Período:</strong> <span th:text="${reserva.periodo}"></span></p><p><strong>Finalidade:</strong> <span th:text="${reserva.finalidade}"></span></p></div><div class="d-flex gap-2 mt-4"><a class="btn btn-outline-secondary" th:href="@{/reservas/{id}(id=${reserva.id})}">Voltar</a><form method="post" th:action="@{/reservas/{id}/cancelar(id=${reserva.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-danger" type="submit">Confirmar cancelamento</button></form></div></main></body></html>
