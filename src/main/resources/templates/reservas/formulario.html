<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reserva | Gerenciador de Salas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<header th:replace="~{fragmentos/layout :: cabecalho}"></header><main class="container py-5" style="max-width:900px"><h1 th:text="${edicao} ? 'Alterar reserva' : 'Nova reserva'"></h1><p class="text-muted">Alterações são revalidadas e só são permitidas enquanto a reserva estiver criada.</p>
<form class="card card-body shadow-sm" method="post" th:object="${form}" th:action="${acao}">
 <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div>
 <div class="row g-3"><div class="col-md-6"><label class="form-label" for="salaId">Sala</label><select class="form-select" id="salaId" th:field="*{salaId}" required><option value="">Escolha</option><option th:each="s:${salas}" th:value="${s.id}" th:text="${s.nome}"></option></select><div class="text-danger" th:errors="*{salaId}"></div></div>
 <div class="col-md-6"><label class="form-label" for="professorId">Professor (opcional)</label><select class="form-select" id="professorId" th:field="*{professorId}"><option value="">Nenhum</option><option th:each="p:${professores}" th:value="${p.id}" th:text="${p.nome}"></option></select></div>
 <div class="col-md-6"><label class="form-label" for="inicio">Início</label><input class="form-control" id="inicio" type="datetime-local" th:field="*{inicio}" required><div class="text-danger" th:errors="*{inicio}"></div></div><div class="col-md-6"><label class="form-label" for="termino">Término</label><input class="form-control" id="termino" type="datetime-local" th:field="*{termino}" required><div class="text-danger" th:errors="*{termino}"></div></div>
 <div class="col-12"><label class="form-label" for="finalidade">Finalidade</label><textarea class="form-control" id="finalidade" rows="3" maxlength="500" th:field="*{finalidade}" required></textarea><div class="text-danger" th:errors="*{finalidade}"></div></div></div>
 <fieldset class="mt-4"><legend class="h5">Materiais (opcional)</legend><p class="text-muted">Informe até três materiais diferentes.</p><div class="row g-2" th:each="n:${#numbers.sequence(1,3)}"><div class="col-sm-8"><label class="visually-hidden" th:for="${'materialId'+n}">Material</label><select class="form-select" th:id="${'materialId'+n}" th:field="*{__${'materialId'+n}__}"><option value="">Nenhum</option><option th:each="m:${materiais}" th:value="${m.id}" th:text="${m.nome}"></option></select></div><div class="col-sm-4"><label class="visually-hidden" th:for="${'quantidade'+n}">Quantidade</label><input class="form-control" min="1" type="number" placeholder="Quantidade" th:id="${'quantidade'+n}" th:field="*{__${'quantidade'+n}__}"></div></div></fieldset>
 <div class="d-flex gap-2 mt-4"><a class="btn btn-outline-secondary" th:href="@{/reservas}">Cancelar</a><button class="btn btn-primary" type="submit" th:text="${edicao} ? 'Salvar alteração' : 'Criar reserva'"></button></div>
</form></main></body></html>
