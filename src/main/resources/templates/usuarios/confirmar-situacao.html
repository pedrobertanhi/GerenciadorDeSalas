<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários | Gerenciador de Salas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
  <h1 th:text="${usuario.ativo ? 'Confirmar inativação' : 'Confirmar ativação'}"></h1>
  <p>Conta <strong th:text="${usuario.nome}"></strong> (<span th:text="${usuario.email}"></span>).</p>
  <p th:if="${usuario.ativo}">A conta perderá o acesso e o histórico será preservado.</p>
  <p th:unless="${usuario.ativo}">A conta poderá entrar no sistema novamente.</p>
  <form method="post" th:action="@{/usuarios/{id}/situacao(id=${usuario.id})}" class="d-flex flex-wrap gap-2">
    <input type="hidden" name="ativar" th:value="${!usuario.ativo}">
    <button type="submit" class="btn btn-primary" th:text="${usuario.ativo ? 'Inativar usuário' : 'Ativar usuário'}"></button>
    <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a>
  </form>
</main>
</body>
</html>
