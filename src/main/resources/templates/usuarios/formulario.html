<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários | Gerenciador de Salas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<header th:replace="~{fragmentos/layout :: cabecalho}"></header>
<main class="container py-4">
  <h1 th:text="${id == null ? 'Cadastrar usuário' : 'Editar usuário'}"></h1>
  <p class="alert alert-warning" role="alert" th:if="${aviso}" th:text="${aviso}"></p>
  <form class="col-md-7 col-lg-5" method="post"
        th:action="${id == null} ? @{/usuarios} : @{/usuarios/{id}/editar(id=${id})}" th:object="${form}">
    <div class="mb-3">
      <label for="nome" class="form-label">Nome</label>
      <input id="nome" class="form-control" th:field="*{nome}" maxlength="150" required>
      <p class="text-danger" th:errors="*{nome}"></p>
    </div>
    <th:block th:if="${id == null}">
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input id="email" class="form-control" type="email" th:field="*{email}" maxlength="254" required>
        <p class="text-danger" th:errors="*{email}"></p>
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha inicial</label>
        <input id="senha" name="senha" class="form-control" type="password" autocomplete="new-password"
               minlength="10" maxlength="72" aria-describedby="senha-ajuda" required>
        <div id="senha-ajuda" class="form-text">Use de 10 a 72 caracteres ASCII, com pelo menos uma letra e um número.</div>
        <p th:if="${#fields.hasErrors('senha')}" class="text-danger">Informe uma senha que siga os critérios acima.</p>
      </div>
    </th:block>
    <div class="mb-3">
      <label for="perfil" class="form-label">Perfil</label>
      <select id="perfil" class="form-select" th:field="*{perfil}" required>
        <option value="">Selecione um perfil</option>
        <option th:each="perfil : ${perfis}" th:value="${perfil}" th:text="${perfil}"></option>
      </select>
      <p class="text-danger" th:if="${#fields.hasErrors('perfil')}">Selecione um perfil válido.</p>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-primary" type="submit">Salvar</button>
      <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a>
    </div>
  </form>
</main>
</body>
</html>
