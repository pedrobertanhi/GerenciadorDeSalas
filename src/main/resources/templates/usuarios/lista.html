<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários | Gerenciador de Salas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<header th:replace="~{fragmentos/layout :: cabecalho}"></header>
<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h1>Usuários</h1>
    <a class="btn btn-primary" th:href="@{/usuarios/novo}">Cadastrar usuário</a>
  </div>
  <p th:if="${sucesso}" class="alert alert-success" role="status" th:text="${sucesso}"></p>
  <p th:if="${aviso}" class="alert alert-warning" role="alert" th:text="${aviso}"></p>
  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <caption>Contas cadastradas</caption>
      <thead><tr><th scope="col">Nome</th><th scope="col">E-mail</th><th scope="col">Perfil</th><th scope="col">Situação</th><th scope="col">Ações</th></tr></thead>
      <tbody>
        <tr th:each="usuario : ${resultado.content}">
          <td th:text="${usuario.nome}"></td>
          <td th:text="${usuario.email}"></td>
          <td th:text="${usuario.perfil}"></td>
          <td th:text="${usuario.ativo ? 'Ativo' : 'Inativo'}"></td>
          <td><div class="d-flex gap-2 flex-wrap">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/usuarios/{id}/editar(id=${usuario.id})}">Editar</a>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/usuarios/{id}/situacao(id=${usuario.id})}"
               th:text="${usuario.ativo ? 'Inativar' : 'Ativar'}"></a>
          </div></td>
        </tr>
        <tr th:if="${resultado.empty}"><td colspan="5">Nenhum usuário cadastrado.</td></tr>
      </tbody>
    </table>
  </div>
  <nav th:if="${resultado.totalPages > 1}" class="d-flex gap-3 align-items-center mb-3" aria-label="Paginação de usuários">
    <a th:if="${resultado.hasPrevious()}" th:href="@{/usuarios(page=${resultado.number - 1})}">Anterior</a>
    <span th:text="|Página ${resultado.number + 1} de ${resultado.totalPages}|"></span>
    <a th:if="${resultado.hasNext()}" th:href="@{/usuarios(page=${resultado.number + 1})}">Próxima</a>
  </nav>
  <a th:href="@{/salas}">Voltar para salas</a>
</main>
</body>
</html>
