<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bloqueio de manutenção | Gerenciador de Salas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 820px">
  <h1 class="mb-4">Bloqueio de manutenção</h1>
  <div th:if="${sucesso}" class="alert alert-success" role="status" th:text="${sucesso}"></div>
  <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
  <div class="card card-body shadow-sm mb-4">
    <dl class="row mb-0">
      <dt class="col-sm-4">Recurso</dt>
      <dd class="col-sm-8" th:text="${bloqueio.recurso}"></dd>
      <dt class="col-sm-4">Período</dt>
      <dd class="col-sm-8" th:text="${bloqueio.periodo}"></dd>
      <dt class="col-sm-4">Motivo</dt>
      <dd class="col-sm-8" th:text="${bloqueio.motivo}"></dd>
      <dt class="col-sm-4">Estado</dt>
      <dd class="col-sm-8"><span class="badge" th:classappend="${bloqueio.classeEstado}" th:text="${bloqueio.estado}"></span></dd>
      <dt class="col-sm-4" th:if="${bloqueio.encerradoEm}">Encerrado em</dt>
      <dd class="col-sm-8" th:if="${bloqueio.encerradoEm}" th:text="${bloqueio.encerradoEm}"></dd>
    </dl>
  </div>
  <section class="card card-body shadow-sm mb-4" aria-labelledby="impacto">
    <h2 class="h5" id="impacto">Impacto sobre a disponibilidade</h2>
    <p th:text="${bloqueio.disponibilidade}"></p>
    <div th:if="${bloqueio.bloqueiaDisponibilidade and bloqueio.reservasNoPeriodo > 0}" class="alert alert-warning mb-0" role="alert">
      Há <strong th:text="${bloqueio.reservasNoPeriodo}">0</strong> reserva(s) ativa(s) neste período.
      Elas não são canceladas nem alteradas automaticamente e permanecem no histórico.
    </div>
    <p th:if="${bloqueio.bloqueiaDisponibilidade and bloqueio.reservasNoPeriodo == 0}" class="text-muted mb-0">
      Nenhuma reserva ativa neste período.
    </p>
  </section>
  <div class="d-flex flex-wrap gap-2">
    <a class="btn btn-outline-secondary" th:href="@{/manutencoes}">Voltar para a lista</a>
    <a th:if="${administrador and bloqueio.ativo}" class="btn btn-outline-primary"
       th:href="@{/manutencoes/{id}/editar(id=${bloqueio.id})}">Editar</a>
    <form th:if="${administrador and bloqueio.podeConcluir}" method="post"
          th:action="@{/manutencoes/{id}/concluir(id=${bloqueio.id})}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="btn btn-success" type="submit">Concluir manutenção</button>
    </form>
    <form th:if="${administrador and bloqueio.ativo}" method="post"
          th:action="@{/manutencoes/{id}/cancelar(id=${bloqueio.id})}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="btn btn-outline-danger" type="submit">Cancelar bloqueio</button>
    </form>
  </div>
</main>
</body>
</html>
