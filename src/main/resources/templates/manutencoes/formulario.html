<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' | Gerenciador de Salas'">Manutenção</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 720px">
  <h1 class="mb-4" th:text="${titulo}">Registrar bloqueio de manutenção</h1>
  <form method="post" th:action="${acao}" th:object="${form}" class="card card-body shadow-sm">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="text-danger mb-3" th:if="${#fields.hasGlobalErrors()}">
      <div th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></div>
    </div>
    <div class="mb-3" th:if="${edicao}">
      <label class="form-label" for="recursoFixo">Recurso</label>
      <input id="recursoFixo" type="text" class="form-control" th:value="${rotuloRecurso}" disabled>
      <input type="hidden" name="recurso" th:value="*{recurso}">
      <div class="form-text">O recurso de um bloqueio não pode ser trocado.</div>
    </div>
    <div class="mb-3" th:unless="${edicao}">
      <label class="form-label" for="recurso">Recurso</label>
      <select id="recurso" name="recurso" class="form-select" required>
        <option value="">Escolha o recurso</option>
        <optgroup th:each="grupo : ${grupos}" th:label="${grupo.titulo}">
          <option th:each="opcao : ${grupo.opcoes}" th:value="${opcao.valor}" th:text="${opcao.rotulo}"
                  th:selected="${opcao.valor == form.recurso}"></option>
        </optgroup>
      </select>
    </div>
    <div class="text-danger mb-3" th:if="${#fields.hasErrors('recurso')}" th:errors="*{recurso}"></div>
    <div class="mb-3">
      <label class="form-label" for="motivo">Motivo</label>
      <textarea id="motivo" class="form-control" rows="3" maxlength="500" th:field="*{motivo}" required></textarea>
      <div class="form-text">Até 500 caracteres.</div>
      <div class="text-danger" th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}"></div>
    </div>
    <div class="row g-3 mb-3">
      <div class="col-sm-6">
        <label class="form-label" for="inicio">Início</label>
        <input id="inicio" type="datetime-local" class="form-control" th:field="*{inicio}" required>
        <div class="text-danger" th:if="${#fields.hasErrors('inicio')}" th:errors="*{inicio}"></div>
      </div>
      <div class="col-sm-6">
        <label class="form-label" for="fim">Fim</label>
        <input id="fim" type="datetime-local" class="form-control" th:field="*{fim}" required>
        <div class="text-danger" th:if="${#fields.hasErrors('fim')}" th:errors="*{fim}"></div>
      </div>
    </div>
    <div class="form-text mb-3">Horário de Brasília. O fim deve ser posterior ao início e estar no futuro.</div>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-primary" type="submit">Salvar</button>
      <a class="btn btn-outline-secondary" th:href="@{/manutencoes}">Cancelar</a>
    </div>
  </form>
</main>
</body>
</html>
