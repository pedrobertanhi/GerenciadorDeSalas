<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manutenção | Gerenciador de Salas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <h1>Manutenção de recursos</h1>
    <a class="btn btn-primary" th:if="${administrador}" th:href="@{/manutencoes/novo}">Registrar bloqueio</a>
  </div>
  <div th:if="${sucesso}" class="alert alert-success" role="status" th:text="${sucesso}"></div>
  <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
  <div th:if="${aviso}" class="alert alert-warning" role="alert" th:text="${aviso}"></div>
  <div th:if="${erroFiltro}" class="alert alert-danger" role="alert" th:text="${erroFiltro}"></div>
  <form method="get" th:action="@{/manutencoes}" class="row g-2 mb-4">
    <div class="col-sm-4">
      <label for="tipo" class="form-label">Tipo de recurso</label>
      <select id="tipo" name="tipo" class="form-select">
        <option value="">Todos</option>
        <option th:each="opcao : ${tipos}" th:value="${opcao.valor}" th:text="${opcao.rotulo}"
                th:selected="${opcao.valor == tipo}"></option>
      </select>
    </div>
    <div class="col-sm-4">
      <label for="status" class="form-label">Estado</label>
      <select id="status" name="status" class="form-select">
        <option value="">Todos</option>
        <option th:each="opcao : ${estados}" th:value="${opcao.valor}" th:text="${opcao.rotulo}"
                th:selected="${opcao.valor == status}"></option>
      </select>
    </div>
    <div class="col-sm-4 d-flex align-items-end gap-2">
      <button class="btn btn-outline-primary" type="submit">Filtrar</button>
      <a class="btn btn-outline-secondary" th:href="@{/manutencoes}">Limpar</a>
    </div>
  </form>
  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <caption>Bloqueios de manutenção, do início mais recente ao mais antigo. Os encerrados permanecem como histórico.</caption>
      <thead>
        <tr>
          <th scope="col">Recurso</th>
          <th scope="col">Período</th>
          <th scope="col">Motivo</th>
          <th scope="col">Estado</th>
          <th scope="col">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="bloqueio : ${resultado.content}">
          <td th:text="${bloqueio.recurso}"></td>
          <td th:text="${bloqueio.periodo}"></td>
          <td th:text="${bloqueio.motivo}"></td>
          <td><span class="badge" th:classappend="${bloqueio.classeEstado}" th:text="${bloqueio.estado}"></span></td>
          <td>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/manutencoes/{id}(id=${bloqueio.id})}">Detalhes</a>
            <a th:if="${administrador and bloqueio.ativo}" class="btn btn-sm btn-outline-primary"
               th:href="@{/manutencoes/{id}/editar(id=${bloqueio.id})}">Editar</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(resultado.content)}">
          <td colspan="5" class="text-center">Nenhum bloqueio encontrado.</td>
        </tr>
      </tbody>
    </table>
  </div>
  <nav th:if="${resultado.totalPages > 1}" aria-label="Paginação dos bloqueios">
    <ul class="pagination">
      <li class="page-item" th:classappend="${resultado.first} ? 'disabled'">
        <a class="page-link" th:href="@{/manutencoes(page=${resultado.number - 1},tipo=${tipo},status=${status})}">Anterior</a>
      </li>
      <li class="page-item disabled">
        <span class="page-link" th:text="'Página ' + ${resultado.number + 1} + ' de ' + ${resultado.totalPages}"></span>
      </li>
      <li class="page-item" th:classappend="${resultado.last} ? 'disabled'">
        <a class="page-link" th:href="@{/manutencoes(page=${resultado.number + 1},tipo=${tipo},status=${status})}">Próxima</a>
      </li>
    </ul>
  </nav>
</main>
</body>
</html>
