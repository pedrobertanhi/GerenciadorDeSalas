name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Revisao de dependencias
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Bloquear novas vulnerabilidades criticas e altas
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
