name: Secret Detection

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixar historico para detectar segredos
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar segredos no historico do repositorio
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
