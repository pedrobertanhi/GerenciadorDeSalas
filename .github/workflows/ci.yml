name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Executar verificação Maven
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # Relatorios brutos gerados pelo Maven; disponiveis mesmo em falha de testes.
      - name: Publicar relatorios Surefire Failsafe e cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-maven-${{ github.run_attempt }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/jacoco.exec
          if-no-files-found: warn
          retention-days: 30

      # Capturas reais das telas, geradas pelos testes E2E (ENT-03, #185).
      - name: Publicar capturas de tela
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capturas-de-tela
          path: target/capturas/
          if-no-files-found: ignore
          retention-days: 30
